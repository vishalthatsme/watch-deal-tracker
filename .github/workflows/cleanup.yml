name: Remove macOS metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove metadata sidecars
        shell: bash
        run: |
          find . -not -path './.git/*' -type f -name '._*' -print -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/cleanup.yml
          git add -A
          git commit -m 'Remove macOS metadata artifacts'
          git push
